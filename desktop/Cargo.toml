[workspace]
resolver = "3"
members = ["crates/chat-core", "crates/providers", "crates/app-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
chat-core = { path = "crates/chat-core" }
providers = { path = "crates/providers" }
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"

[workspace.lints.clippy]
# Nearly every event and log entry is the large variant, a message.
large_enum_variant = "allow"

# Dependencies are optimised even in dev builds: unoptimised text shaping and
# layout make a chat client visibly stutter.
[profile.dev.package."*"]
opt-level = 2
debug = false
